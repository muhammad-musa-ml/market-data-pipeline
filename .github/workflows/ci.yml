name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Compile protobuf
        run: python scripts/gen_proto.py
      - name: Compose files parse
        run: docker compose config -q
      - run: pytest

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-spark.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements-spark.txt
      - name: Compile protobuf
        run: python scripts/gen_proto.py
      - name: Spark transformations, models and text-to-SQL checks
        run: pytest tests/analytics tests/test_sqlcheck.py tests/test_backends.py
